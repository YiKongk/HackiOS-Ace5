# OnePlus Ace 5 PKG110: use tools/ace5 and docs/BUILD.zh-CN.md for RAM boot.
# Generic common/build/run cannot supply the device-specific guarded boot chain.
NAME="OnePlus Ace 5 (PKG110 / giulia)"
KIND=phone
SOC="Qualcomm SM8650 (Snapdragon 8 Gen 3)"
PORT_STAGE=diagnostic
UEFI_TARGET=giulia
UEFI_FD=
DTB=
FD_BASE=0xA7100000
FD_SIZE=0x300000
PAYLOAD_BASE=0xA8000000
FB_BASE=0xD5100000
WIFI_ATH11K=0
BOOTARGS="-v cpus=1"
DEFAULT_SECS=15
USERLAND_VARS="PREBUILT=1 GL=0"
FIRMWARE=""
